<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ifrah & Muhsin | Wedding Invitation</title>

ormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --pink:#ff76b4;
    --light-pink:#ffe4f0;
    --gold:#d4af37;
    --dark:#4a3e46;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    color:var(--dark);
    overflow-x:hidden;
    background:
    linear-gradient(135deg,#fff7fb,#ffe4f0);
    min-height:100vh;
}

.floating{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    z-index:-1;
}

.floating.one{
    width:250px;
    height:250px;
    background:#ffcadf;
    top:-100px;
    left:-100px;
}

.floating.two{
    width:250px;
    height:250px;
    background:#ffd9eb;
    bottom:-100px;
    right:-100px;
}

.glass{
    background:rgba(255,255,255,0.22);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.45);
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    border-radius:28px;
}

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.invitation-card{
    max-width:900px;
    width:100%;
    text-align:center;
    padding:60px 30px;
}

.subtitle{
    color:var(--gold);
    letter-spacing:4px;
    text-transform:uppercase;
    font-size:0.9rem;
}

.gold-line{
    width:120px;
    height:2px;
    margin:20px auto;
    background:linear-gradient(to right,transparent,var(--gold),transparent);
}

.names{
    font-family:'Cormorant Garamond',serif;
    font-size:5rem;
    font-weight:600;
    color:var(--pink);
    line-height:1.1;
}

.and{
    color:var(--gold);
}

.message{
    max-width:650px;
    margin:20px auto;
    line-height:1.8;
}

.section{
    padding:80px 20px;
}

.section-title{
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:3.2rem;
    color:var(--pink);
    margin-bottom:40px;
}

.details{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    max-width:1000px;
    margin:auto;
}

.box{
    padding:30px;
    text-align:center;
}

.box h3{
    margin-bottom:15px;
    color:var(--gold);
}

.box p{
    font-size:1rem;
}

.countdown{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.time-box{
    width:120px;
    padding:25px;
    text-align:center;
}

.number{
    display:block;
    font-size:2.5rem;
    color:var(--pink);
    font-weight:600;
}

.label{
    color:#777;
}

.location-card{
    max-width:700px;
    margin:auto;
    padding:40px;
    text-align:center;
}

.location-card h3{
    margin-bottom:15px;
    color:var(--gold);
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 30px;
    border-radius:50px;
    text-decoration:none;
    color:white;
    font-weight:600;
    background:linear-gradient(135deg,var(--gold),#f0c75e);
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

footer{
    text-align:center;
    padding:40px 20px;
    color:#777;
}

.heart{
    color:#ff4b8b;
}

@media(max-width:768px){

.names{
    font-size:3rem;
}

.section-title{
    font-size:2.3rem;
}

.invitation-card{
    padding:40px 20px;
}

.time-box{
    width:100px;
}

}

</style>
</head>
<body>

<div class="floating one"></div>
<div class="floating two"></div>

<section class="hero">

<div class="glass invitation-card">

<p class="subtitle">Wedding Invitation</p>

<div class="gold-line"></div>

<h1 class="names">
<span id="brideName">Ifrah</span>
<span class="and">&</span>
<span id="groomName">Muhsin</span>
</h1>

<p class="message">
Together with our families, we warmly invite you to join us in celebrating our Nikkah and to share in the joy of beginning this beautiful journey together.
</p>

<div class="gold-line"></div>

</div>

</section
